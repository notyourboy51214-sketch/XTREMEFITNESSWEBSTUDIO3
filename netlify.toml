[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application routing rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control for static image assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
